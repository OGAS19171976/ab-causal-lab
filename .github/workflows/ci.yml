# ============================================================================
# CI：把"这套数字可信"从本机搬到任何人可验证的地方
# ============================================================================
# 这个仓库的全部主张都是"可复现、可验证"。在配 CI 之前，
# "测试通过、验证脚本 exit=0"只在一个人的机器上成立 ——
# 那不算证据，那算复述。这个工作流把同一件事变成公开、可点开、可重跑的东西。
#
# 两个 job 并行：
#   tests       静态检查 + 锁文件校验 + pytest（反馈最快）
#   validation  全部验证脚本（较慢）
#
# 两者的命令定义来自同一处 —— scripts/run_all_checks.py。
# 这正是那个脚本存在的理由：CI 与本地各写一份命令清单，迟早漂移，
# 于是"本地绿、CI 没跑那一步"这种假绿灯会一直存在。
#
# 这里**刻意不写"多少个测试""几个脚本"**：那是会随每次改动漂移的数字，
# 而它漂移时没有任何东西会报错。要看当前清单就跑
# `python scripts/run_all_checks.py --list`。
#
# 注意 Ubuntu 上跑图会走 label() 的英文回退分支（容器里没有 CJK 字体），
# 这是设计好的行为而不是故障 —— 见 ablab/plotting.py。
# ============================================================================

name: checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # 同一分支只保留最新一次：验证脚本要跑十几分钟，排队没意义
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # matplotlib 默认把字体缓存写到 ~/.matplotlib；本仓库在导入前把它指到项目内，
  # 这里再显式给一份，确保 CI 上也不依赖 HOME 的可写性
  MPLCONFIGDIR: build/.mplconfig
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    name: 检查 + 测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 版本从 .python-version 读，而不是在 YAML 里再写一遍。
          # 两处各写一份就会出现"CI 在 3.13 上绿、本机是 3.14"这种漂移；
          # .python-version 同时被 uv / pyenv / setup-python 认，是单一来源。
          # 若 setup-python 尚未提供该版本，CI 会在这**一步**明确失败 ——
          # 那远好过悄悄换一个版本把后面的检查跑绿。
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: 安装依赖（按锁文件，不用 requirements.txt）
        # **CI 装锁文件**：requirements.txt 只钉死直接依赖，传递依赖交给 resolver ——
        # 那意味着 CI 上装到的闭包可能与本机锁定的不同，于是下面那步 `--check`
        # 会因为"传递依赖漂移"而红，而红的原因与代码无关。
        # 锁文件里带 `; marker` 的行（colorama / tzdata 只在 Windows 需要）
        # 由 pip 按平台自动跳过 —— 这正是把 marker 写进锁文件的好处。
        run: pip install -r requirements.lock
      - name: 记录环境（排查 CI 失败时先看这一条）
        run: |
          python -VV
          python -c "import numpy, scipy, pandas, duckdb, pyarrow, matplotlib, sklearn, fastapi; print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
      - name: 静态检查（ruff，配置见 pyproject）
        run: python -m ruff check src scripts tests
      - name: 依赖声明与锁文件一致
        run: python scripts/lock_requirements.py --check
      - name: pytest
        run: pytest tests/
      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: build/checks/tests.log
          if-no-files-found: ignore

  validation:
    name: 验证脚本（M0–M6 + 数仓）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: 安装依赖（按锁文件，理由见 tests job）
        run: pip install -r requirements.lock
      # run_all_checks.py 里写死了一条顺序依赖：warehouse 必须排在 m5/m6 之前，
      # 否则那两段的数仓内容会因为 build/warehouse.duckdb 不存在而**静默跳过**
      # （报告里只剩一句"跳过"，汇总却仍然全绿）。
      - name: 跑全部验证脚本
        run: python scripts/run_all_checks.py --skip-tests
      # 关键一步：把证据本身作为产物发布。
      # 报告与图是这个项目的交付物，CI 不该只报"绿了"，该把东西交出来。
      - name: 发布报告与图（证据）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/
            build/checks/
          if-no-files-found: warn
          retention-days: 30
