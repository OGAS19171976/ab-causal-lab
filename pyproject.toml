[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ablab"
version = "0.1.0"
description = "确定性分流 + A/B 实验分析 + 因果推断仿真验证台"
requires-python = ">=3.10"

# 这里声明的是**支持范围**（下界），不是实测版本 ——
# 实测通过的版本组合在 requirements.txt 与 requirements.lock 里。
# 分层与 M0–M6 的依赖关系对应，缺哪一层跑哪一段会报错：
dependencies = [
    # M0–M3：分流 / 推断 / 序贯 / 因果 / 数仓 / 出图
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "duckdb>=0.10",
    "pyarrow>=14",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# M4：DML 的 nuisance 学习器需要任意复杂的 ML 模型（这正是 DML 的意义）
ml = ["scikit-learn>=1.3"]
# M5/M6：平台接口
web = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
# 完整开发环境：pip install -e ".[dev]"
# httpx 是 fastapi.testclient 的传输层依赖，漏了它接口测试会 ImportError
# packaging 给 scripts/lock_requirements.py 用（解析 Requires-Dist 的版本与 marker；
# 脚本里有正则兜底，但没有它时闭包会靠"宁可多写一行"的保守判断）
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
    "packaging>=22",
    "ruff>=0.6",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.urls]
# 有仓库地址就填上 —— 对一个"讲证据"的项目，别人能一键找到 CI 记录很重要。
# 现在是占位；没填之前别让它出现在发布元数据里，所以先注释掉。
# Homepage = "https://github.com/OWNER/ab-causal-lab"

[tool.hatch.build.targets.wheel]
packages = ["src/ablab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# 注意：这里的 -q 与命令行再传一个 -q 会变成 -qq，**把 "N passed" 汇总行也吞掉**。
# 想要汇总就走 `pytest tests/`，别加额外的 -q。
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
# ruff 的配置刻意**保守**。理由：这个仓库注释密度高、命名故意很长
# （`cuped_variance_reduction` 而不是 `vr`），而 ruff 的"现代化"规则
# （UP / SIM / RUF / FURB / PLW / BLE）会大量改写这类写法 —— 那会产出一个
# 几百行的纯风格 diff，把真正的改动淹没，且**不改变任何正确性**。
#
# 所以只开"能查出真问题"的几类：
#   E4/E7/E9 + F —— 语法级错误、未定义名、未使用的导入与变量（ruff 默认集）
#   I            —— 导入顺序（机器管，不靠人记）
#   RUF100       —— 失效的 `# noqa`（残留的抑制注释会让后来人以为那儿还有问题）
#
# 首次接入的实测收获（都是真缺陷，不是风格）：`hashing.py` 的注解用了惰性导入的 `np`、
# `analysis.py` 的注解用了没导入的 `LookData`、`build.py` 的 `__all__` 列了不存在的
# `SplitStatements`（真名 `split_statements`）、2 个未使用导入、7 个未使用变量。
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF100"]
# 中文注释按字符计宽会误报行长；行长本身交给格式化的概念去管
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 测试里为可读性会保留构造用的中间量，那些"未使用"是刻意的
"tests/*" = ["F841"]
